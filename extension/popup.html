<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orbyte Flow Settings</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #18181b;
      color: #f4f4f5;
    }
    h2 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 4px;
      color: #34d399;
    }
    p {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
      color: #e4e4e7;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #09090b;
      color: #ffffff;
      font-size: 12px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      background: #059669;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #10b981;
    }
    .status {
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
      color: #34d399;
      display: none;
    }
  </style>
</head>
<body>
  <h2>⚡ Orbyte Flow Settings</h2>
  <p>Configure backend API server connection.</p>
  
  <label for="apiUrl">Backend API URL:</label>
  <input type="text" id="apiUrl" placeholder="http://localhost:3000" value="http://localhost:3000">

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status">Saved!</div>

  <script src="popup.js"></script>
</body>
</html>
